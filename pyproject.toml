[project]
name = "redcom-calc"
version = "0.1.0"
description = "Калькулятор абонентской платы «Рэдком» (консоль)"
requires-python = ">=3.11"

[project.scripts]
redcom-calc = "redcom_calc.cli.app:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "flet>=0.25,<1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redcom_calc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
